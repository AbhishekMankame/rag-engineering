[project]
name = "rag-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Mankame", email = "abhishekmankame962@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.2",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
rag-engineering = "rag_engineering:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
